#单位秒 s
#规范: RedisKeyGenerator + Ttl: ***
redis:
  cache:
    ttl:
      product-detail-ttl: 86400 #商品详情缓存
      product-collection-ttl: 86400 #商品收藏列表缓存
      product-view-ttl: 86400 #商品浏览量缓存
      order-ttl: 900 #订单取消时间，15分钟
      cart-ttl: 86400 #购物车缓存
      order-user-ttl: 1800 #用户订单缓存时间
      coupon-user-ttl: 1800 #用户持有优惠券缓存时间

    count:
      hot-product-cache-size: 20 #热门商品缓存数量
  bucket:
    ttl:
      hot-product-read-bucket-ttl: 10 #热门商品 读标记位
      hot-product-write-bucket-ttl: 30 #热门商品 写标记位